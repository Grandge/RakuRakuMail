<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      CSP（要件定義書 6.2）
      外部スクリプトは Google Identity Services の1本だけを許可する。
      GIS は <script> 読み込みしか提供していないため、これが唯一の例外。
      style-src の 'unsafe-inline' は React のインライン style のため。M8で締める。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://accounts.google.com/gsi/client;
        connect-src 'self' https://gmail.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com;
        frame-src https://accounts.google.com;
        img-src 'self' data: blob:;
        style-src 'self' 'unsafe-inline';
        base-uri 'self';
        form-action 'none';
        object-src 'none';
      "
    />

    <title>らくらくメール</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
